openapi: 3.0.3
info:
  title: MCSV Backoffice API
  description: Complete API specification for MCSV Backoffice platform
  version: 1.0.0
  contact:
    name: API Support
    url: https://github.com/DN-PORTAL/mcsv-backoffice
  license:
    name: Apache 2.0

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Calendars
    description: API for event calendars management
  - name: Comments
    description: API for comments management
  - name: Communities
    description: API for communities management
  - name: Deliveries
    description: API for deliveries management
  - name: Deliveries Medias
    description: API for deliveries media management
  - name: Deliveries Principles
    description: API for deliveries principles management
  - name: DeveloperLevel
    description: API for developer level management
  - name: Event Categories
    description: API for event category management
  - name: Events
    description: API for event management
  - name: EventDetails
    description: API for event detail management
  - name: Event Status
    description: API for event status management
  - name: Leaders
    description: API for leaders management
  - name: Media
    description: API for media files management
  - name: Notices
    description: API for notices management
  - name: Period
    description: API for period management
  - name: Portal
    description: API for portal management

paths:
  # ============ CALENDAR ENDPOINTS ============
  /api/v1/calendars:
    post:
      tags:
        - Calendars
      summary: Create a new calendar with optional EventDetail files
      operationId: createCalendar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        '201':
          description: Calendar created successfully
        '400':
          description: Invalid input

    get:
      tags:
        - Calendars
      summary: Get all calendars
      operationId: getAllCalendars
      responses:
        '200':
          description: Successfully retrieved list

  /api/v1/calendars/{id}:
    get:
      tags:
        - Calendars
      summary: Get a calendar by its ID
      operationId: getCalendarById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the calendar to retrieve
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Calendar found
        '404':
          description: Calendar not found

    put:
      tags:
        - Calendars
      summary: Update an existing calendar
      operationId: updateCalendar
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the calendar to update
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        '200':
          description: Calendar updated successfully
        '404':
          description: Calendar not found
        '400':
          description: Invalid input

    delete:
      tags:
        - Calendars
      summary: Delete a calendar by its ID
      operationId: deleteCalendar
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the calendar to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Calendar deleted successfully
        '404':
          description: Calendar not found

  /api/v1/calendars/paginate:
    post:
      tags:
        - Calendars
      summary: Get a paginated list of calendars
      operationId: getPaginatedCalendars
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginationModel'
      responses:
        '200':
          description: Successfully retrieved list

  /api/v1/calendars/media/{mediaId}/status:
    get:
      tags:
        - Calendars
      summary: Get video processing status for a media file
      operationId: getMediaProcessingStatus
      parameters:
        - name: mediaId
          in: path
          required: true
          description: ID of the media file
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success

  /api/v1/calendars/media/{mediaId}:
    delete:
      tags:
        - Calendars
      summary: Delete a media file from a calendar event
      operationId: deleteCalendarMedia
      parameters:
        - name: mediaId
          in: path
          required: true
          description: ID of the media file to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Media deleted successfully
        '404':
          description: Media not found

  /api/v1/calendars/by-event/{eventId}:
    get:
      tags:
        - Calendars
      summary: Get calendars by event ID
      operationId: getCalendarsByEventId
      parameters:
        - name: eventId
          in: path
          required: true
          description: ID of the event
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successfully retrieved list

  /api/v1/calendars/by-period:
    get:
      tags:
        - Calendars
      summary: Get calendars by period (month and year)
      operationId: getCalendarsByPeriod
      parameters:
        - name: month
          in: query
          required: true
          description: Month of the period
          schema:
            type: integer
        - name: year
          in: query
          required: true
          description: Year of the period
          schema:
            type: integer
      responses:
        '200':
          description: Successfully retrieved list

