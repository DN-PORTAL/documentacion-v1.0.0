  /api/v1/communities/by-name/{name}:
    get:
      tags:
        - Communities
      summary: Find community by name
      operationId: getCommunityByName
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the community
          schema:
            type: string
      responses:
