  /api/v1/comments/paginate:
    post:
      tags:
        - Comments
      summary: Get a paginated list of comments
      operationId: getPaginatedComments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginationModel'
      responses:
        '200':
          description: Successfully retrieved list

  /api/v1/comments/by-notice/{noticeId}:
    get:
      tags:
        - Comments
      summary: Get comments by notice ID
      operationId: getCommentsByNoticeId
      parameters:
