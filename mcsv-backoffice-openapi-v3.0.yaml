  /api/v1/communities/search:
    get:
      tags:
        - Communities
      summary: Search communities by name containing
      operationId: searchCommunitiesByName
      parameters:
        - name: name
          in: query
          required: true
          description: Name or part of name to search
          schema:
            type: string
      responses:
